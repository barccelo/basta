<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f5f7"><meta name="apple-mobile-web-app-capable" content="yes"><title>¡Basta!</title><link rel="stylesheet" href="style.css"></head><body><main>
<header><a class="brand" href="./" aria-label="Basta">Basta</a><div class="tools"><button class="icon" id="fullscreen" aria-label="Pantalla completa"><svg viewBox="0 0 24 24"><path d="M8 4H4v4m12-4h4v4M4 16v4h4m12-4v4h-4"/></svg></button><button class="icon" id="settings" aria-label="Ajustes"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="3"/><circle cx="16" cy="17" r="3"/></svg></button></div></header>
<div class="topline"><span id="round">RONDA 01</span><div class="segmented" id="shapes" aria-label="Forma del tablero"><button data-shape="square" class="active" aria-pressed="true">Pantalla</button><button data-shape="circle" aria-pressed="false">Círculo</button></div></div>
<section id="stage"><div id="arena" aria-label="Rueda de letras"><div id="oval"></div><div id="letters"></div><div class="center"><section class="category-area"><button id="category" aria-label="Cambiar categoría"><span id="categoryText">Animales</span><svg viewBox="0 0 24 24"><path d="m16 3 4 4-4 4M20 7H8a4 4 0 0 0-4 4m4 10-4-4 4-4m-4 4h12a4 4 0 0 0 4-4"/></svg></button><div id="player">Sin jugadores</div></section><div class="button-shell"><svg id="progress" viewBox="0 0 200 200" aria-hidden="true"><rect class="track" x="6" y="6" width="188" height="188" rx="60"/><rect id="progressArc" x="6" y="6" width="188" height="188" rx="60" pathLength="100"/></svg><button id="hit"><span class="button-brand">BASTA</span><strong id="time">10</strong><span id="hitLabel">EMPEZAR</span></button></div><span id="answerCount" hidden></span><button id="pause" aria-label="Pausar temporizador"><svg viewBox="0 0 20 20"><path d="M7 5v10M13 5v10"/></svg><span>Pausa</span></button></div></div></section>
<div class="bottomline"><span id="remaining">22 letras</span><span id="categoryTotal">100 categorías</span></div><footer><button id="scores"><svg viewBox="0 0 20 20"><circle cx="10" cy="6" r="3"/><path d="M4 17v-2a6 6 0 0 1 12 0v2"/></svg><span>Sin jugadores</span></button><button id="newRound">Nueva ronda <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17 17 7M7 7h10v10"/></svg></button></footer>
</main>
<dialog id="config"><div class="dialog-head"><h2>Ajustes</h2><button class="close" data-close aria-label="Cerrar"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 7 10 10M17 7 7 17"/></svg></button></div><label>Modo de juego</label><div class="segmented wide" id="modes"><button data-mode="free">Sin jugadores</button><button data-mode="players">Con jugadores</button></div><div id="playerOptions"><label for="names">Nombres separados por coma</label><input id="names" type="text" placeholder="Ana, David, Sofía…"><label for="target">Cartas para ganar</label><select id="target"><option value="3">3 cartas</option><option value="5">5 cartas</option><option value="10">10 cartas</option></select></div><label>Segundos por turno</label><div class="chips" id="durations"></div><label for="alphabet">Letras</label><select id="alphabet"><option value="classic">Clásicas · 22 letras</option><option value="all">Abecedario completo · 27 letras</option></select><div class="toggle"><label for="rotate">Girar con el dedo</label><input id="rotate" type="checkbox" role="switch"></div><div class="toggle"><label for="sound">Sonido</label><input id="sound" type="checkbox" role="switch"></div><div class="toggle"><label for="vibrate">Vibración</label><input id="vibrate" type="checkbox" role="switch"></div><button class="primary" id="save">Guardar</button></dialog>
<dialog id="categories"><div class="dialog-head"><h2>Categorías</h2><button class="close" data-close aria-label="Cerrar"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 7 10 10M17 7 7 17"/></svg></button></div><label for="categoryGroup">Temas</label><select id="categoryGroup"><option value="all">Todos los temas</option></select><button class="primary" id="random"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M5.5 8a7 7 0 0 1 11.6-3L20 8M4 16l2.9 3A7 7 0 0 0 18.5 16"/></svg><span>Al azar</span></button><div class="list" id="categoryList"></div><label for="custom">Tu categoría</label><form id="customForm" class="actions"><input id="custom" type="text" maxlength="60" placeholder="Algo nuevo…" required><button class="primary" aria-label="Añadir categoría"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button></form></dialog>
<dialog id="pauseMenu"><div class="dialog-head"><h2>Pausa</h2><button class="close" id="closePause" aria-label="Volver al juego"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 7 10 10M17 7 7 17"/></svg></button></div><button class="primary" id="resumeGame">Seguir jugando</button><div class="pause-actions"><button id="pauseSettings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="3"/><circle cx="16" cy="17" r="3"/></svg><span>Ajustes</span></button><button id="pauseScores"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3"/><path d="M3 20v-2a6 6 0 0 1 12 0v2M16 5a3 3 0 0 1 0 6M18 14a5 5 0 0 1 3 4v2"/></svg><span>Jugadores y marcador</span></button><button id="pauseFullscreen"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4H4v4m12-4h4v4M4 16v4h4m12-4v4h-4"/></svg><span>Pantalla completa</span></button><button id="pauseRound"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5"/><path d="M5 8a7 7 0 1 0 12-3l3 3"/></svg><span>Nueva ronda</span></button></div></dialog>
<dialog id="result"><h2 id="resultTitle">¡Tiempo!</h2><p id="resultText"></p><div id="resultScores"></div><button class="primary" id="continue">Continuar</button><button class="secondary" id="resultNew" hidden>Nueva ronda</button></dialog>
<dialog id="scoreboard"><div class="dialog-head"><h2>Marcador</h2><button class="close" data-close aria-label="Cerrar"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 7 10 10M17 7 7 17"/></svg></button></div><div id="scoreList"></div><button class="secondary" id="restartGame">Nueva partida</button></dialog>
<dialog id="confirm"><div class="dialog-head"><h2 id="confirmTitle">¿Nueva ronda?</h2><button class="close" data-close aria-label="Cerrar"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 7 10 10M17 7 7 17"/></svg></button></div><div class="actions"><button class="secondary" id="cancelReset">Volver</button><button class="primary" id="confirmReset">Empezar</button></div></dialog>
<div class="toast" id="toast" role="status"></div><script src="categories.js"></script><script src="app.js"></script></body></html>
